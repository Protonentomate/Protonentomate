<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0e10">
<meta name="description" content="Minimalistischer, dunkler Geburtstags-Countdown bis zum 2. Dezember 2026 um 00:00:01 Uhr Schweizer Zeit. Offline, mit drei Bewegungsmodi.">
<title>Countdown · 2. Dezember</title>
<style>
:root{color-scheme:dark;--bg:#0c0e10;--ink:#dce0d5;--muted:#858a8d;--accent:#be8c60;--dw:84px;--dh:130px;--face:117px;--radius:180px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100svh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 46%,#1b1e21 0%,#101214 43%,#0a0c0e 83%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stage{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:110px 38px}
.instrument-wrap{width:min(100%,1100px);min-width:0;position:relative}
.instrument-wrap:after{content:"";position:absolute;bottom:-16px;left:5%;right:5%;height:25px;background:#000b;filter:blur(20px);border-radius:50%;z-index:0}
.instrument{position:relative;z-index:1;border:1px solid #3e4347;border-bottom:3px solid #181b1d;border-radius:13px;padding:27px 29px 25px;background:linear-gradient(155deg,#303438 0%,#23272a 37%,#24292c 62%,#191d20 100%);box-shadow:inset 0 1px 0 #ffffff12,inset 1px 0 0 #ffffff06,0 4px 0 #080a0c,0 22px 50px -16px #000c}
.screw{position:absolute;width:7px;height:7px;border-radius:50%;background:linear-gradient(145deg,#4d5458,#202528);box-shadow:inset 0 .5px 1px #ffffff20,0 1px 1px #0009}
.screw:after{content:"";position:absolute;top:3px;left:1px;width:5px;height:1px;transform:rotate(-32deg);background:#101518;box-shadow:0 .5px #626b6d55}
.screw.tl{top:10px;left:10px}.screw.tr{top:10px;right:10px}.screw.bl{bottom:10px;left:10px}.screw.br{bottom:10px;right:10px}
.screen{padding:24px 20px 18px;border:1px solid #090c0d;border-radius:6px;background:#101416;box-shadow:inset 0 4px 14px #000a,0 1px 0 #ffffff0c;position:relative;overflow:hidden}
.screen:before{content:"";position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(#0008,transparent);pointer-events:none;z-index:4}
.readout{display:flex;align-items:flex-start;justify-content:center;min-height:calc(var(--dh) + 30px);position:relative;gap:0}
.unit{display:flex;align-items:center;flex-direction:column;flex-shrink:0}
.digits{display:flex;gap:3px;align-items:center}
.digit{width:var(--dw);height:var(--dh);position:relative;overflow:hidden;perspective:850px;border-radius:4px;background:#0b0e0f;border:1px solid #080b0c;box-shadow:0 1px 0 #ffffff09,inset 2px 0 3px #0008;isolation:isolate;flex-shrink:0}
.rotor{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;left:0;top:50%;width:100%;height:var(--face);margin-top:calc(var(--face) / -2);backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:calc(var(--dw) * 1.28);font-weight:600;line-height:1;letter-spacing:-.08em;padding-right:.08em;color:#d9dece;background:linear-gradient(#1c2323 0%,#303934 38%,#2c362f 55%,#1c2520 100%);border-bottom:1px solid #090f0b;text-shadow:0 2px 1px #0009}
.digit:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(#000a 0%,#0004 15%,transparent 36%,#d0e0bd08 50%,transparent 56%,#0004 82%,#000b 100%);box-shadow:inset 3px 0 5px #0005,inset -2px 0 4px #0005}
.unit-label{margin-top:14px;color:#7d8880;letter-spacing:.19em;font-size:8px;text-transform:uppercase;white-space:nowrap}
.separator{display:flex;align-items:center;justify-content:center;height:var(--dh);width:clamp(13px,3.1vw,40px);flex-shrink:0}
.colon{display:flex;flex-direction:column;gap:16px;opacity:.5}
.colon:before,.colon:after{content:"";width:3px;height:3px;background:#a3ae9d;border-radius:50%;box-shadow:0 1px 1px #000}
.punctuation{font-family:Georgia,serif;font-size:calc(var(--dw) * .57);line-height:1;align-self:flex-end;margin:0 2px 14px;color:#8d9b87;flex:0 0 calc(var(--dw) * .18)}
.punctuation.grouping{font-family:Arial,sans-serif;align-self:flex-start;margin-top:16px;margin-bottom:0;font-size:calc(var(--dw) * .36);flex-basis:calc(var(--dw) * .12)}
.numeric{flex-direction:column;align-items:center;justify-content:flex-start}
.numeric .unit-label{margin-top:14px}
.tools{position:fixed;top:24px;right:27px;display:flex;gap:5px;z-index:10}
.tool{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:transparent;border:1px solid transparent;border-radius:6px;color:#929a9f;transition:background .2s,border-color .2s,color .2s}
.tool:hover{background:#ffffff07;border-color:#ffffff12;color:#e2e4df}
.tool[aria-pressed=true]{color:var(--accent);border-color:#be8c6040}
.controls{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:10}
.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;width:100%}
.tabs,.motion-tabs,.direction-tabs{display:flex;padding:3px;gap:2px;background:#111416d9;border:1px solid #ffffff0d;border-radius:7px;box-shadow:0 4px 20px #0002}
.tab,.motion-option{border:1px solid transparent;background:none;padding:10px 16px;border-radius:4px;font-size:10px;white-space:nowrap;color:#90989c;transition:background .2s,color .2s}
.tab:hover,.motion-option:hover{color:#dce0d8;background:#ffffff05}
.tab[aria-selected=true],.motion-option[aria-pressed=true]{color:#dce0d8;background:#252a2d;border-color:#ffffff08;box-shadow:0 1px 3px #0004}
.motion-tabs{background:transparent;border-color:transparent;box-shadow:none;gap:4px;padding:0}
.motion-option{font-size:9px;padding:7px 11px;color:#8b9297}
.motion-option[aria-pressed=true]{background:#1c2123;border-color:#ffffff0a;color:#c8d0c5}
.motion-option[aria-pressed=true]:before{content:"";display:inline-block;width:3px;height:3px;margin-right:6px;background:var(--accent);border-radius:50%;vertical-align:2px}
.direction-tabs{padding:0;background:transparent;border-color:transparent;box-shadow:none;gap:3px}
.direction-option{background:transparent;border:1px solid transparent;border-radius:4px;font-size:9px;padding:7px 9px;color:#8b9297;transition:background .2s,color .2s;white-space:nowrap}
.direction-option:hover{color:#dce0d8;background:#ffffff05}
.direction-option[aria-pressed=true]{background:#1c2123;border-color:#ffffff0a;color:#c8d0c5}
.direction-option span{display:inline-block;margin-right:4px;color:var(--accent);font-size:11px}
.tools,.controls{transition:opacity .6s}
.quiet .tools,.quiet .controls{opacity:0;pointer-events:none}
.quiet{cursor:none}
.toast{position:fixed;bottom:154px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;padding:11px 17px;background:#22282b;color:#dce0d5;border:1px solid #ffffff12;border-radius:6px;font-size:11px;z-index:20;transition:opacity .2s,transform .2s;text-align:center;width:max-content;max-width:90vw;box-shadow:0 4px 20px #0005}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.finished .instrument{border-top-color:#66715d}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
noscript{position:fixed;top:30px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:900px){.stage{padding:110px 25px}.instrument{padding:24px 22px 22px}.screen{padding:22px 14px 17px}.separator{width:25px}}
@media(max-width:600px){.stage{padding:100px 13px}.instrument{padding:20px 12px 19px;border-radius:10px}.screen{padding:17px 8px 12px}.digits{gap:2px}.separator{width:13px}.colon{gap:9px}.colon:before,.colon:after{width:2px;height:2px}.unit-label,.numeric .unit-label{font-size:6px;letter-spacing:.12em;margin-top:11px}.readout{min-height:calc(var(--dh) + 25px)}.tools{top:14px;right:13px}.tool{width:36px;height:36px}.controls{bottom:25px;gap:10px}.tabs{gap:0;padding:3px}.tab{font-size:9px;padding:10px 10px}.motion-option{font-size:9px;padding:8px 10px}.screw{width:6px;height:6px}.screw:after{top:2px;width:4px}.screw.tl{top:8px;left:8px}.screw.tr{top:8px;right:8px}.screw.bl{bottom:8px;left:8px}.screw.br{bottom:8px;right:8px}}
@media(max-width:365px){.stage{padding-left:9px;padding-right:9px}.tab{padding:10px 7px}.motion-option{padding:8px 9px}}
@media(max-height:540px){.stage{padding-top:65px;padding-bottom:150px}.controls{bottom:17px;gap:8px}.instrument-wrap{max-width:850px}.instrument{padding-top:20px;padding-bottom:20px}.screen{padding-top:15px;padding-bottom:11px}.tools{top:12px;right:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="tools">
  <button class="tool" id="wake" type="button" aria-label="Bildschirm wach halten" aria-pressed="false" title="Bildschirm wach halten" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-.8.6-1.1 1.1-1.1 2.5H9.6c0-1.4-.3-1.9-1.1-2.5Z"/></svg></button>
  <button class="tool" id="fullscreen" type="button" aria-label="Vollbild umschalten" aria-pressed="false" title="Vollbild (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
</div>
<main class="stage">
  <section class="instrument-wrap" aria-label="Countdown bis zum 2. Dezember 2026 um 00:00:01 Uhr Schweizer Zeit">
    <div class="instrument">
      <span class="screw tl" aria-hidden="true"></span><span class="screw tr" aria-hidden="true"></span><span class="screw bl" aria-hidden="true"></span><span class="screw br" aria-hidden="true"></span>
      <div class="screen"><div class="readout" id="readout" aria-hidden="true"></div></div>
    </div>
  </section>
  <div class="sr-only" id="countdown-panel" role="tabpanel" aria-labelledby="tab-classic" tabindex="0"><span id="accessible-countdown"></span></div>
</main>
<div class="controls">
  <div class="tabs" role="tablist" aria-label="Anzeigeeinheit">
    <button class="tab" type="button" role="tab" id="tab-classic" aria-controls="countdown-panel" aria-selected="true" data-mode="classic" title="Tage, Stunden, Minuten und Sekunden (1)">Klassisch</button>
    <button class="tab" type="button" role="tab" id="tab-hours" aria-controls="countdown-panel" aria-selected="false" tabindex="-1" data-mode="hours" title="Gesamtzeit in Stunden (2)">Stunden</button>
    <button class="tab" type="button" role="tab" id="tab-minutes" aria-controls="countdown-panel" aria-selected="false" tabindex="-1" data-mode="minutes" title="Gesamte Minuten und Sekunden (3)">Minuten</button>
    <button class="tab" type="button" role="tab" id="tab-seconds" aria-controls="countdown-panel" aria-selected="false" tabindex="-1" data-mode="seconds" title="Gesamtzeit in Sekunden (4)">Sekunden</button>
    <button class="tab" type="button" role="tab" id="tab-milliseconds" aria-controls="countdown-panel" aria-selected="false" tabindex="-1" data-mode="milliseconds" title="Gesamtzeit in Millisekunden (5)">Millisekunden</button>
  </div>
  <div class="settings">
  <div class="motion-tabs" role="group" aria-label="Bewegung der Zahlenräder">
    <button class="motion-option" type="button" data-motion="stepped" aria-pressed="false" title="Alle Räder wechseln schrittweise zwischen ganzen Ziffern">Schrittweise</button>
    <button class="motion-option" type="button" data-motion="smallest" aria-pressed="true" title="Das Rad ganz rechts dreht kontinuierlich und nimmt grössere Räder beim Übertrag synchron mit.">Kleinstes Rad</button>
    <button class="motion-option" type="button" data-motion="all" aria-pressed="false" title="Alle Räder drehen kontinuierlich, auch zwischen zwei Ziffern">Alle Räder</button>
  </div>
  <div class="direction-tabs" role="group" aria-label="Drehrichtung">
    <button class="direction-option" type="button" data-direction="up" aria-pressed="true" title="Zahlen nach oben drehen (R)"><span aria-hidden="true">↑</span>Nach oben</button>
    <button class="direction-option" type="button" data-direction="down" aria-pressed="false" title="Zahlen nach unten drehen (R)"><span aria-hidden="true">↓</span>Nach unten</button>
  </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="birthday-status" class="sr-only" role="status" aria-live="polite"></div>
<noscript>Bitte JavaScript einschalten.</noscript>
<script>
(() => {
  'use strict';
  const TARGET = Date.parse('2026-12-02T00:00:01+01:00');
  const MODES = {
    classic:{},
    hours:{divisor:360,decimals:4,label:'Stunden'},
    minutes:{divisor:1000,decimals:0,mixed:true,label:'Minuten'},
    seconds:{divisor:1000,decimals:0,label:'Sekunden'},
    milliseconds:{divisor:1,decimals:0,label:'Millisekunden'}
  };
  const readout=document.getElementById('readout');
  const tabs=[...document.querySelectorAll('.tab')];
  const motionOptions=[...document.querySelectorAll('.motion-option')];
  const directionOptions=[...document.querySelectorAll('.direction-option')];
  const storage={
    get(key){try{return localStorage.getItem('vorfreude.'+key)}catch{return null}},
    set(key,value){try{localStorage.setItem('vorfreude.'+key,value)}catch{}}
  };
  const savedMotion=storage.get('motion');
  let direction=storage.get('direction')==='down'?'down':'up';
  let motion=['stepped','smallest','all'].includes(savedMotion)?savedMotion:(matchMedia('(prefers-reduced-motion: reduce)').matches?'stepped':'smallest');
  let mode='classic',rollers=[],birthShown=false,lastAccessible=-1,raf=0;
  let resizeQueued=false,wakeLock=null,wantsWake=false,idleTimer,toastTimer;
  // Interpolate the system clock at animation-frame precision; recheck it for clock corrections.
  let clockMono=performance.now(),clockWall=Date.now(),lastClockCheck=clockMono;
  function remaining(){
    const mono=performance.now();
    if(mono-lastClockCheck>1000){
      const wall=Date.now();
      if(Math.abs(wall-(clockWall+mono-clockMono))>25){clockWall=wall;clockMono=mono}
      lastClockCheck=mono;
    }
    return Math.max(0,TARGET-(clockWall+mono-clockMono));
  }
  const pad=(n,size=2)=>String(n).padStart(size,'0');
  function parts(ms){const n=Math.floor(Math.max(0,ms)/1000);return{days:Math.floor(n/86400),hours:Math.floor(n/3600)%24,minutes:Math.floor(n/60)%60,seconds:n%60}}
  function format(ms,selected=mode){
    if(selected==='classic'){const p=parts(ms);return `${p.days} Tage, ${p.hours} Stunden, ${p.minutes} Minuten und ${p.seconds} Sekunden`}
    if(selected==='minutes'){const whole=Math.floor(Math.max(0,ms)/1000);return `${Math.floor(whole/60).toLocaleString('de-CH')} Minuten und ${pad(whole%60)} Sekunden`}
    const m=MODES[selected];
    return (Math.floor(Math.max(0,ms)/m.divisor)/10**m.decimals).toLocaleString('de-CH',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals}).replace('.',',')+' '+m.label;
  }
  function addDrum(parent,divisor,modulus=null){
    const digit=document.createElement('div');digit.className='digit';
    const rotor=document.createElement('div');rotor.className='rotor';
    for(let i=0;i<10;i++){
      const face=document.createElement('span');face.className='face';face.textContent=i;
      face.style.transform=faceTransform(i,direction);rotor.append(face);
    }
    digit.append(rotor);parent.append(digit);rollers.push({rotor,divisor,modulus,last:null,override:null,overrideValue:null});
  }
  function addClassicGroup(size,label,base,modulus,grouped=false){
    const unit=document.createElement('div');unit.className='unit';
    const digits=document.createElement('div');digits.className='digits';
    for(let p=size-1;p>=0;p--){
      if(grouped&&p<size-1&&(p+1)%3===0){const group=document.createElement('span');group.className='punctuation grouping';group.textContent='’';digits.append(group)}
      addDrum(digits,base*10**p,modulus?{modulus,p}:null);
    }
    const caption=document.createElement('div');caption.className='unit-label';caption.textContent=label;
    unit.append(digits,caption);readout.append(unit);
  }
  function selectMode(next,save=true){
    if(!MODES[next])return;
    mode=next;rollers=[];readout.replaceChildren();readout.className='readout';
    const delta=remaining();
    if(mode==='classic'){
      const groups=[[Math.max(2,String(parts(delta).days).length),'Tage',86400,null],[2,'Stunden',3600,24],[2,'Minuten',60,60],[2,'Sekunden',1,60]];
      groups.forEach((g,i)=>{
        if(i){const sep=document.createElement('div');sep.className='separator';sep.innerHTML='<span class="colon"></span>';readout.append(sep)}
        addClassicGroup(...g);
      });
    }else if(mode==='minutes'){
      const size=String(Math.floor(delta/60000)).length;
      addClassicGroup(size,'Minuten',60,null,true);
      const sep=document.createElement('div');sep.className='separator';sep.innerHTML='<span class="colon"></span>';readout.append(sep);
      addClassicGroup(2,'Sekunden',1,60);
    }else{
      const m=MODES[mode];
      const integerDigits=Math.max(1,String(Math.floor(delta/(m.divisor*10**m.decimals))).length);
      const size=integerDigits+m.decimals;
      readout.classList.add('numeric');
      const digits=document.createElement('div');digits.className='digits';
      for(let i=0;i<size;i++){
        if(i===integerDigits&&m.decimals){const point=document.createElement('span');point.className='punctuation';point.textContent=',';digits.append(point)}
        else if(i>0&&i<integerDigits&&(integerDigits-i)%3===0){const group=document.createElement('span');group.className='punctuation grouping';group.textContent='’';digits.append(group)}
        addDrum(digits,10**(size-i-1));
      }
      const label=document.createElement('div');label.className='unit-label';label.textContent=m.label;readout.append(digits,label);
    }
    tabs.forEach(tab=>{const selected=tab.dataset.mode===mode;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1});
    document.getElementById('countdown-panel').setAttribute('aria-labelledby','tab-'+mode);
    lastAccessible=-1;
    if(save)storage.set('mode',mode);
    fit();draw();
  }
  function selectMotion(next,save=true){
    if(!['stepped','smallest','all'].includes(next))return;
    motion=next;
    motionOptions.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.motion===motion)));
    if(save)storage.set('motion',motion);
    draw();
  }
  function selectDirection(next,save=true){
    if(!['up','down'].includes(next))return;
    direction=next;
    directionOptions.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.direction===direction)));
    for(const roller of rollers){
      [...roller.rotor.children].forEach((face,i)=>face.style.transform=faceTransform(i,direction));
      roller.last=null;
    }
    if(save)storage.set('direction',direction);
    draw();
  }
  function fit(){
    const width=readout.clientWidth,gap=innerWidth<=600?2:3;
    let digitWidth;
    if(mode==='classic'||mode==='minutes'){
      const sepWidth=readout.querySelector('.separator')?.getBoundingClientRect().width||13;
      const units=readout.querySelectorAll('.unit').length,groups=readout.querySelectorAll('.grouping').length;
      const gapCount=[...readout.querySelectorAll('.digits')].reduce((count,el)=>count+el.children.length-1,0);
      digitWidth=(width-sepWidth*(units-1)-gap*gapCount-groups*4)/(rollers.length+groups*.12);
    }else{
      const groups=readout.querySelectorAll('.grouping').length;
      const punctuation=MODES[mode].decimals?.18:0;
      const count=readout.querySelector('.digits').children.length;
      digitWidth=(width-gap*(count-1)-groups*4-(punctuation?4:0))/(rollers.length+groups*.12+punctuation);
    }
    digitWidth=Math.max(12,Math.min(90,digitWidth));
    const h=digitWidth*1.55,face=h*.9,radius=face/(2*Math.tan(Math.PI/10));
    readout.style.setProperty('--dw',digitWidth+'px');readout.style.setProperty('--dh',h+'px');
    readout.style.setProperty('--face',face+'px');readout.style.setProperty('--radius',radius+'px');
  }
  function rollerDigit(value,roller){
    if(roller.modulus){
      const {modulus,p}=roller.modulus,unit=Math.floor(value/(roller.divisor/10**p))%modulus;
      return Math.floor(unit/10**p)%10;
    }
    return Math.floor(value/roller.divisor)%10;
  }
  function drumPosition(value,roller,selectedMotion,isSmallest){
    if(selectedMotion==='smallest'&&!isSmallest){
      // During 20 -> 19 the right wheel turns 0 -> 9, carrying the tens wheel 2 -> 1.
      // Both travel one face in the same tick, with the identical linear fraction.
      // Compare real clock digits so the same carry also works at 60 seconds and 24 hours.
      const digit=rollerDigit(value,roller),previous=rollerDigit(Math.floor(value)+1,roller);
      if(previous===digit)return{phase:digit,override:null,next:null};
      const fraction=value-Math.floor(value),slot=(digit+1)%10;
      return{phase:digit+fraction,override:slot!==previous?slot:null,next:previous};
    }
    const continuous=selectedMotion==='all'||(selectedMotion==='smallest'&&isSmallest);
    if(!continuous)return{phase:rollerDigit(value,roller),override:null,next:null};
    if(!roller.modulus)return{phase:(value/roller.divisor)%10,override:null,next:null};
    // Clock wheels have shortened cycles: minute tens wrap 5 -> 0, hour digits 23 -> 00.
    const {modulus,p}=roller.modulus,power=10**p,base=roller.divisor/power;
    const unit=(value/base)%modulus,index=Math.floor(unit/power);
    const span=Math.min(power,modulus-index*power);
    const fraction=(unit-index*power)/span;
    const digit=index%10,slot=(digit+1)%10,next=(Math.floor(((index+1)*power)%modulus/power))%10;
    return{phase:digit+fraction,override:slot!==next?slot:null,next};
  }
  function faceTransform(index,selectedDirection){
    const sign=selectedDirection==='down'?-1:1;
    return `rotateX(${sign*index*36}deg) translateZ(var(--radius))`;
  }
  function rotorTransform(phase,selectedDirection){
    const sign=selectedDirection==='down'?-1:1;
    return `translateZ(calc(-1 * var(--radius))) rotateX(${-sign*phase*36}deg)`;
  }
  function paintRoller(roller,position){
    const {phase,override,next}=position;
    if(roller.override!==null&&roller.override!==override)roller.rotor.children[roller.override].textContent=roller.override;
    if(override!==null&&(roller.override!==override||roller.overrideValue!==next))roller.rotor.children[override].textContent=next;
    roller.override=override;roller.overrideValue=next;
    if(phase!==roller.last){roller.rotor.style.transform=rotorTransform(phase,direction);roller.last=phase}
  }
  function draw(){
    const delta=remaining(),value=delta/(mode==='classic'?1000:MODES[mode].divisor);
    rollers.forEach((roller,i)=>paintRoller(roller,drumPosition(value,roller,motion,i===rollers.length-1)));
    const second=Math.floor(delta/1000);
    if(second!==lastAccessible){
      document.getElementById('accessible-countdown').textContent=delta?format(delta):'Alles Gute zum Geburtstag, Brian!';
      lastAccessible=second;const p=parts(delta);
      document.title=delta?`${p.days}d ${pad(p.hours)}:${pad(p.minutes)}:${pad(p.seconds)} · Countdown`:'Alles Gute zum Geburtstag, Brian!';
    }
    if(!delta&&!birthShown){birthShown=true;document.body.classList.add('finished');document.getElementById('birthday-status').textContent='Alles Gute zum Geburtstag, Brian!'}
  }
  function loop(){draw();if(!document.hidden)raf=requestAnimationFrame(loop);else raf=0}
  function toast(message){
    clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');
    toastTimer=setTimeout(()=>el.classList.remove('visible'),4000);
  }
  const isFullscreen=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  async function toggleFullscreen(){
    try{
      const root=document.documentElement,exit=document.exitFullscreen||document.webkitExitFullscreen,enter=root.requestFullscreen||root.webkitRequestFullscreen;
      if(isFullscreen()&&exit)await exit.call(document);else if(enter)await enter.call(root);
      else toast('Browser-Vollbild: auf dem Mac Ctrl + Cmd + F, unter Windows F11.');
    }catch{toast('Browser-Vollbild: auf dem Mac Ctrl + Cmd + F, unter Windows F11.')}
  }
  function activity(){
    document.body.classList.remove('quiet');clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>{
      if(!document.querySelector('.tools :focus-visible, .controls :focus-visible')&&!document.querySelector('.tools:hover, .controls:hover'))document.body.classList.add('quiet');
    },6000);
  }
  const wakeButton=document.getElementById('wake');
  async function acquireWake(){
    if(!wantsWake||document.hidden)return;
    try{
      const lock=await navigator.wakeLock.request('screen');
      if(!wantsWake){await lock.release();return}
      wakeLock=lock;lock.addEventListener('release',()=>{if(wakeLock===lock){wakeLock=null;wakeButton.setAttribute('aria-pressed','false')}});
      wakeButton.setAttribute('aria-pressed','true');
    }catch{wantsWake=false;wakeButton.setAttribute('aria-pressed','false');toast('Wachhalten ist in diesem Browser nicht verfügbar.')}
  }
  if('wakeLock' in navigator){
    wakeButton.hidden=false;
    wakeButton.addEventListener('click',async()=>{
      wantsWake=!wantsWake;
      if(wantsWake){await acquireWake();if(wakeLock)toast('Der Bildschirm bleibt wach, solange diese Seite sichtbar ist.')}
      else{await wakeLock?.release();wakeButton.setAttribute('aria-pressed','false')}
    });
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>selectMode(tab.dataset.mode)));
  motionOptions.forEach(button=>button.addEventListener('click',()=>selectMotion(button.dataset.motion)));
  directionOptions.forEach(button=>button.addEventListener('click',()=>selectDirection(button.dataset.direction)));
  document.querySelector('.tabs').addEventListener('keydown',e=>{
    const current=tabs.indexOf(document.activeElement);if(current<0)return;let next;
    if(e.key==='ArrowRight')next=(current+1)%tabs.length;
    else if(e.key==='ArrowLeft')next=(current+tabs.length-1)%tabs.length;
    else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;
    e.preventDefault();selectMode(tabs[next].dataset.mode);tabs[next].focus();
  });
  document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);
  function fullscreenChanged(){
    const active=isFullscreen(),button=document.getElementById('fullscreen');
    button.setAttribute('aria-pressed',String(active));button.setAttribute('title',active?'Vollbild verlassen (F)':'Vollbild (F)');activity();fit();
  }
  document.addEventListener('fullscreenchange',fullscreenChanged);document.addEventListener('webkitfullscreenchange',fullscreenChanged);
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    activity();
    if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen()}
    else if(/^[1-5]$/.test(e.key)){e.preventDefault();selectMode(Object.keys(MODES)[Number(e.key)-1])}
    else if(e.key.toLowerCase()==='m'){e.preventDefault();const choices=['stepped','smallest','all'];selectMotion(choices[(choices.indexOf(motion)+1)%3])}
    else if(e.key.toLowerCase()==='r'){e.preventDefault();selectDirection(direction==='up'?'down':'up')}
  });
  document.addEventListener('pointermove',activity,{passive:true});
  document.addEventListener('pointerdown',activity,{passive:true});
  document.addEventListener('focusin',activity);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){draw();if(!raf)raf=requestAnimationFrame(loop);if(wantsWake&&!wakeLock)acquireWake()}});
  window.addEventListener('pageshow',()=>{draw();if(!raf)raf=requestAnimationFrame(loop)});
  window.addEventListener('resize',()=>{if(!resizeQueued){resizeQueued=true;requestAnimationFrame(()=>{fit();resizeQueued=false})}});
  selectMode(storage.get('mode')||'classic',false);selectMotion(motion,false);selectDirection(direction,false);activity();raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
